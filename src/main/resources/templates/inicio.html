<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Controle de Eventos</title>
        <link rel="stylesheet" th:href="@{/css/inicio.css}">
    </head>
    <body>
        <main class="pagina-inicial">
            <section class="apresentacao">
                <p class="etiqueta">Sistema acadêmico</p>
                <h1>Controle de Eventos</h1>
                <p class="descricao">Organize eventos, participantes e inscrições em um só lugar.</p>
                <a class="botao-principal" th:href="@{/eventos}">Ver eventos</a>
            </section>
            <section class="atalhos">
                <a th:href="@{/eventos}">
                    <h2>Eventos</h2><p>Cadastre e acompanhe a agenda.</p>
                </a>
                <a th:href="@{/participantes}">
                    <h2>Participantes</h2><p>Gerencie os dados de contato.</p>
                </a>
                <a th:href="@{/inscricoes}">
                    <h2>Inscrições</h2><p>Vincule participantes aos eventos.</p>
                </a>
                <a th:href="@{/relatorios}">
                    <h2>Relatórios</h2>;
                    <p>Acompanhe os dados cadastrados</p>
                </a>
            </section>
        </main>
    </body>
</html>
