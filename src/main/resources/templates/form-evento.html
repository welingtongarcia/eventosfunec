<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Evento</title>
        <link rel="stylesheet" th:href="@{/css/cadastro-evento.css}">
    </head>
    <body>
        <main class="pagina-cadastro">
            <section class="cartao-cadastro">
                <a class="voltar" th:href="@{/eventos}">&larr; Voltar para eventos</a>
                <h1
                    th:text="${evento.id == null
                    ? 'Cadastro de Evento'
                    : 'Editar Evento'}">
                    Cadastro de Evento
                </h1>
                <p class="subtitulo">Preencha os dados abaixo para publicar um novo evento.</p>
                <form th:action="@{/eventos/salvar}" th:object="${evento}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="campo campo-completo">
                        <label for="titulo">Título</label>
                        <input id="titulo" type="text" th:field="*{titulo}" placeholder="Ex.: Workshop de Java">
                        <span class="erro" th:errors="*{titulo}"></span>
                    </div>
                    <div class="campo campo-completo">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" th:field="*{descricao}" placeholder="Descreva o evento"></textarea>
                        <span class="erro" th:errors="*{descricao}"></span>
                    </div>
                    <div class="linha-campos">
                        <div class="campo">
                            <label for="data">Data</label>
                            <input id="data" type="date" th:field="*{data}">
                            <span class="erro" th:errors="*{data}"></span>
                        </div>
                        <div class="campo">
                            <label for="hora">Horário</label>
                            <input id="hora" type="time" th:field="*{hora}">
                            <span class="erro" th:errors="*{hora}"></span>
                        </div>
                    </div>
                    <div class="linha-campos">
                        <div class="campo">
                            <label for="local">Local</label>
                            <input id="local" type="text" th:field="*{local}" placeholder="Ex.: Auditório principal">
                            <span class="erro" th:errors="*{local}"></span>
                        </div>
                        <div class="campo">
                            <label for="quantidadeVagas">Quantidade de vagas</label>
                            <input id="quantidadeVagas" type="number" min="1" th:field="*{quantidadeVagas}" placeholder="0">
                            <span class="erro" th:errors="*{quantidadeVagas}"></span>
                        </div>
                    </div>
                    <button
                        type="submit"
                        th:text="${evento.id == null
                        ? 'Salvar Evento'
                        : 'Salvar Alterações'}">
                        Salvar Evento
                    </button>
                </form>
            </section>
        </main>
    </body>
</html>
